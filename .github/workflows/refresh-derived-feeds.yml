name: Refresh derived feeds

on:
  schedule:
    # GitHub cron uses UTC. 15:10 UTC is 00:10 JST.
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generated-site-publishing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://anes-jc.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove expired draft gates
        run: node scripts/remove-draft-gates.mjs

      - name: Generate Sunday article at Sunday midnight
        run: |
          if [ "$(TZ=Asia/Tokyo date +%u)" != "7" ]; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install pillow
          node scripts/generate-sunday-article.mjs
          python scripts/generate-sunday-ogp.py "$(ls articles/latest-papers-*.html | sort | tail -n 1)"

      - name: Generate sitemap and RSS feed
        run: |
          node scripts/generate-sitemap.mjs
          node scripts/generate-rss.mjs

      - name: Publish derived feed changes
        run: |
          if [ -z "$(git status --porcelain -- articles assets/og data/sunday-articles.js sitemap.xml feed.xml)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles assets/og data/sunday-articles.js sitemap.xml feed.xml
          git commit -m "Refresh scheduled site outputs"
          git pull --rebase
          git push
